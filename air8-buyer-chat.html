<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air8 Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  :root { --blue: #1d4ed8; --blue-light: #eff6ff; --blue-mid: #bfdbfe; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .fade-in { animation: fadeUp .25s ease-out; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .spinner { width:12px;height:12px;border:2px solid #bfdbfe;border-top-color:#1d4ed8;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0; }
  @keyframes stepIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
  .step-row { animation: stepIn .2s ease-out forwards; opacity:0; }
  textarea { resize:none; }
  ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:#e2e8f0;border-radius:4px}
  .tab-active { border-bottom:2px solid #1d4ed8; color:#1d4ed8; font-weight:600; }
  .tab-inactive { border-bottom:2px solid transparent; color:#64748b; }
  .tab-inactive:hover { color:#1e293b; background:#f8fafc; }
  .risk-low  { background:#f0fdf4; color:#15803d; border-color:#bbf7d0; }
  .risk-med  { background:#fffbeb; color:#b45309; border-color:#fde68a; }
  .risk-high { background:#fff1f2; color:#be123c; border-color:#fecdd3; }
  .chip { padding:7px 16px; background:#fff; border:1px solid #e2e8f0; color:#475569; font-size:12px; border-radius:999px; cursor:pointer; transition:all .15s; white-space:nowrap; }
  .chip:hover { background:#eff6ff; color:#1d4ed8; border-color:#bfdbfe; }
</style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden">

<!-- HEADER -->
<header class="bg-white border-b border-gray-200 px-5 py-3.5 flex items-center justify-between flex-shrink-0">
  <div class="flex items-center gap-2.5">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:#1d4ed8">
      <span class="text-white font-bold text-sm">A8</span>
    </div>
    <div>
      <div class="text-sm font-bold text-gray-900">Air8 Intelligence</div>
      <div class="text-[11px] text-gray-400">Buyer · Market · Tariff · Sourcing</div>
    </div>
  </div>
  <div class="flex items-center gap-1.5">
    <div class="w-2 h-2 bg-emerald-400 rounded-full"></div>
    <span class="text-xs text-gray-500">Live</span>
  </div>
</header>

<!-- CHAT -->
<div id="chat" class="flex-1 overflow-y-auto px-4 py-6 space-y-5" style="max-width:860px;margin:0 auto;width:100%">

  <!-- Welcome -->
  <div class="flex justify-center fade-in">
    <div class="bg-white rounded-2xl border border-gray-200 p-6 max-w-lg w-full shadow-sm text-center">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3" style="background:#eff6ff">
        <svg class="w-6 h-6" style="color:#1d4ed8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
      <p class="text-sm font-semibold text-gray-900 mb-1">Ask about any buyer, product, or market</p>
      <p class="text-xs text-gray-500 mb-5">Get structured intelligence with financials, sourcing, products & risk signals</p>

    </div>
  </div>

</div>

<!-- INPUT -->
<div class="bg-white border-t border-gray-200 px-4 pt-3.5 pb-4 flex-shrink-0">
  <div class="flex items-end gap-2" style="max-width:860px;margin:0 auto">
    <div class="flex-1 bg-gray-50 border border-gray-200 rounded-2xl px-4 py-2.5 transition-all focus-within:border-blue-400 focus-within:ring-1 focus-within:ring-blue-200">
      <textarea id="inp" rows="1" placeholder="Ask about any buyer, tariff, product or market trend..."
        class="w-full bg-transparent text-sm text-gray-800 placeholder-gray-400 outline-none leading-relaxed"
        style="max-height:80px" oninput="ar(this)" onkeydown="hk(event)"></textarea>
    </div>
    <button onclick="send()" class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0 text-white transition-colors shadow-sm" style="background:#1d4ed8" onmouseover="this.style.background='#1e40af'" onmouseout="this.style.background='#1d4ed8'">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
      </svg>
    </button>
  </div>
  <p class="text-center text-[10px] text-gray-400 mt-2">Air8 Intelligence · Verify key data before decisions</p>
</div>

<script>
const WORKER = 'https://air8-buyer-chat.erik-ai-bot-001.workers.dev/chat';
let hist = [], charts = {}, _bypassDirectionCheck = false;
let layer1Buyers = new Set(); // buyers that have had a Layer 1 tab card shown

function registerLayer1Buyer(buyerName) {
  if(!buyerName) return;
  const norm = buyerName.toLowerCase().trim();
  layer1Buyers.add(norm);
  // Also store just the first meaningful word ("Ross" from "Ross Stores")
  const words = norm.split(/\s+/).filter(w => w.length > 2);
  if(words[0]) layer1Buyers.add(words[0]);
}

// Pass the FULL user message — we check if any stored buyer name appears in it
// Also scans hist so it works even with other questions in between
function hasSeenLayer1(fullMsg) {
  const norm = (fullMsg || '').toLowerCase();
  // Check in-memory Set
  for(const b of layer1Buyers) {
    if(norm.includes(b)) return true;
  }
  // Scan conversation history (last 40 messages) for Layer 1 responses
  const recent = hist.slice(-40);
  for(const msg of recent) {
    if(msg.role !== 'assistant') continue;
    try {
      const data = JSON.parse(msg.content);
      if(data.buyer) {
        const b = data.buyer.toLowerCase().trim();
        const firstWord = b.split(/\s+/).find(w => w.length > 2) || '';
        if(norm.includes(b) || (firstWord && norm.includes(firstWord))) return true;
      }
    } catch(e) {}
  }
  return false;
}

function ar(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,80)+'px'; }
function hk(e) { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} }
function sq(t) { document.getElementById('inp').value=t; send(); }

// Add a real (data-driven) step to the thinking animation
function addRealStep(thinkId, text, src) {
  const box = document.getElementById(thinkId+'-steps');
  if(!box) return;
  // Mark previous step as done (✓)
  box.querySelectorAll('.step-row').forEach(r => {
    const icon = r.querySelector('.step-icon');
    if(icon && icon.querySelector('.spinner')) {
      icon.innerHTML = '<svg style="width:13px;height:13px;color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>';
      const txt = r.querySelector('.step-text');
      if(txt) txt.style.color='#6b7280';
    }
  });
  // Add new step
  const row = document.createElement('div');
  row.className='flex items-start gap-2.5 step-row';
  row.style.animation='stepIn .2s ease-out forwards';
  row.innerHTML=`<div class="step-icon flex items-center justify-center flex-shrink-0 mt-0.5" style="width:14px;height:14px"><div class="spinner" style="width:12px;height:12px"></div></div><div class="flex-1 min-w-0"><div class="step-text text-xs font-medium leading-snug" style="color:#111827">${esc(text)}${srcBadge(src)}</div></div>`;
  box.appendChild(row);
  scrollDown();
}
function fqClick(cid, idx) {
  const q = window._fq && window._fq[cid] && window._fq[cid][idx];
  if(q) sq(q);
}

function srcBadge(src) {
  if(!src) return '';
  const s = src.toLowerCase();
  let color = '#6b7280', bg = '#f3f4f6';
  if(s.includes('google') || s.includes('brave') || s.includes('web')) { color='#1d4ed8'; bg='#eff6ff'; }
  else if(s.includes('sec') || s.includes('edgar') || s.includes('filing')) { color='#d97706'; bg='#fffbeb'; }
  else if(s.includes('customs') || s.includes('1688') || s.includes('census')) { color='#059669'; bg='#ecfdf5'; }
  else if(s.includes('air8') || s.includes('pulselink')) { color='#7c3aed'; bg='#f5f3ff'; }
  return `<span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full ml-1" style="color:${color};background:${bg}">${esc(src)}</span>`;
}

// ── SEND ─────────────────────────────────────────────────────────────────────
function toggleExplore(label) {
  var dot = label.querySelector('[data-check]');
  if(!dot) return;
  var on = dot.dataset.selected==='1';
  dot.dataset.selected = on?'0':'1';
  label.style.background = on?'#f8faff':'#eff6ff';
  label.style.borderColor = on?'#c7d2fe':'#1d4ed8';
  dot.style.background = on?'':'#1d4ed8';
  dot.innerHTML = on?'':'<svg width="10" height="10" viewBox="0 0 10 10" fill="white"><path d="M2 5l2 2 4-4" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>';
}
function skipExplore() { /* do nothing */ }
function continueExplore(cid) {
  var container = document.getElementById('explore-opts-'+cid);
  if(!container) return;
  var selected = [...container.querySelectorAll('[data-check][data-selected="1"]')].map(el=>el.dataset.check);
  if(!selected.length) return;
  // Build a natural language query from selected option titles
  var labels = [...container.querySelectorAll('[data-check][data-selected="1"]')].map(el=>{
    var lbl = el.closest('label')?.querySelector('.font-bold')?.textContent||'';
    return lbl;
  });
  var q = labels.length===1 ? labels[0] : labels.slice(0,-1).join(', ')+' and '+labels[labels.length-1];
  document.getElementById('inp').value = q;
  send();
}

async function send() {
  const inp=document.getElementById('inp'), msg=inp.value.trim();
  if(!msg) return;
  inp.value=''; inp.style.height='auto';

  // ── DIRECTION PICKER: only intercept if buyer Layer 1 already shown ──
  if(!_bypassDirectionCheck && isGenericBuyerQuery(msg)) {
    if(hasSeenLayer1(msg)) {  // pass full msg — checks hist + Set for buyer substrings
      addUser(msg);
      hist.push({role:'user', content: msg});
      showDirectionPicker(msg, extractBuyerName(msg));
      return;
    }
    // First time for this buyer → fall through to Layer 1 normally
  }
  _bypassDirectionCheck = false;
  const _topicHints = window._lastTopicHints || null; // capture BEFORE clearing
  window._lastTopicHints = null;

  window._lastMsg = msg;
  addUser(msg);
  hist.push({role:'user',content:msg});
  const thinkId = addThinking(guessSteps(msg));

  try {
    let res, _retries = 0;
    const controller = new AbortController();
    const _fetchTimer = setTimeout(() => controller.abort(), 55000); // 55s hard timeout
    while(true) {
      try {
        res = await fetch(WORKER, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message:msg, context:hist.slice(-8), topicHints: _topicHints}),
          signal: controller.signal
        });
        clearTimeout(_fetchTimer);
        break;
      } catch(fetchErr) {
        clearTimeout(_fetchTimer);
        if(fetchErr.name === 'AbortError') throw new Error('请求超时，请重试。');
        if(++_retries > 1) throw fetchErr;
        await new Promise(r => setTimeout(r, 1200));
      }
    }

    if(!res.ok) { removeEl(thinkId); addText('⚠️ Server error: '+res.status); return; }

    const ct = res.headers.get('content-type')||'';

    if(ct.includes('application/json')) {
      const data = await res.json();
      removeEl(thinkId);
      if(data.type === 'clarify') {
        // Disambiguation / clarification card
        addClarifyCard(data);
        hist.push({role:'assistant', content: JSON.stringify({clarify: true, question: data.question||''})});
      } else if(data.tabs && Array.isArray(data.tabs)) {
        // Tab card response (Layer 1 or drill-down)
        addTabCard(data);
        hist.push({role:'assistant', content: JSON.stringify({buyer:data.buyer||'',tab_ids:(data.tabs||[]).map(t=>t.id),summary:data.summary||''})});
      } else {
        // Off-topic / simple text response
        const reply = data.text || data.reply || '';
        if(data.error || !reply) addText('⚠️ '+(data.error||'No response.'));
        else { addMarkdown(reply); hist.push({role:'assistant',content:reply}); }
      }
    } else {
      // SSE — step/done events (buyer) + legacy delta/done (drill-downs)
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf='', fullText='', done_received=false;
      outer: while(true) {
        const {done, value} = await reader.read();
        if(done) break;
        buf += decoder.decode(value, {stream:true});
        const lines = buf.split('\n'); buf = lines.pop()||'';
        for(const line of lines) {
          if(!line.startsWith('data: ')) continue;
          const raw = line.slice(6).trim();
          if(!raw || raw==='[DONE]') continue;
          try {
            const ev = JSON.parse(raw);
            if(ev.type==='ping') continue; // heartbeat — ignore, keeps connection alive
            if(ev.type==='step') { addRealStep(thinkId, ev.text||'', ev.src||''); continue; }
            if(ev.type==='partial' && ev.json) { // PART1 ready — show partial card, keep spinner for PART2
              removeEl(thinkId);
              addTabCard(ev.json);
              // Tag the just-added card so done handler can replace it
              const _chatEl = document.getElementById('chat');
              if(_chatEl.lastElementChild) _chatEl.lastElementChild.id = thinkId+'-partial-card';
              // Add loading indicator below
              const _pc = document.createElement('div');
              _pc.id = thinkId+'-partial-spinner';
              _pc.className = 'flex justify-start gap-2.5 fade-in';
              _pc.innerHTML = `<div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0" style="background:#eff6ff"><span class="text-xs font-bold" style="color:#1d4ed8">A8</span></div><div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm shadow-sm px-4 py-3 flex items-center gap-2"><div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div><span class="text-xs text-gray-400">Loading remaining tabs…</span></div>`;
              _chatEl.appendChild(_pc); scrollDown(); continue;
            }
            if(ev.type==='done' && ev.json) {
              removeEl(thinkId);
              // Remove partial card + spinner, replace with full card
              const _pc2 = document.getElementById(thinkId+'-partial-card');
              if(_pc2) _pc2.remove();
              const _ps = document.getElementById(thinkId+'-partial-spinner');
              if(_ps) _ps.remove();
              if(ev.json.type === 'clarify') {
                addClarifyCard(ev.json);
                hist.push({role:'assistant', content: JSON.stringify({clarify: true, question: ev.json.question||''})});
              } else {
                addTabCard(ev.json);
                hist.push({role:'assistant', content: JSON.stringify({buyer:ev.json.buyer||'',tab_ids:(ev.json.tabs||[]).map(t=>t.id),summary:ev.json.summary||''})});
              }
              done_received=true; break outer;
            }
            if(ev.type==='done' && ev.text) {
              // Robust fallback: try to parse as tab card JSON even if it came through text field
              // Handles code fences + trailing commas
              const _raw = ev.text.replace(/```(?:json)?\s*/g,'').replace(/```\s*/g,'').trim();
              if(_raw.startsWith('{') || _raw.includes('"tabs"')) {
                try {
                  const _m = _raw.match(/\{[\s\S]*\}/);
                  if(_m) {
                    const _s = _m[0].replace(/,(?:\s*[}\]])/g, x=>x.slice(1));
                    const p = JSON.parse(_s);
                    if(p && p.tabs) {
                      removeEl(thinkId); addTabCard(p);
                      hist.push({role:'assistant', content: JSON.stringify({buyer:p.buyer||'',tab_ids:(p.tabs||[]).map(t=>t.id),summary:p.summary||''})});
                      done_received=true; break outer;
                    }
                  }
                } catch(e2) {}
              }
              removeEl(thinkId); addMarkdown(ev.text);
              hist.push({role:'assistant', content: ev.text}); done_received=true; break outer;
            }
            if(ev.delta) fullText += ev.delta;
            if(ev.error) { removeEl(thinkId); addText('⚠️ '+ev.error); done_received=true; break outer; }
            if(ev.done) {
              fullText = ev.text||fullText; removeEl(thinkId);
              addMarkdown(fullText); hist.push({role:'assistant',content:fullText});
              done_received=true; break outer;
            }
          } catch(e) {}
        }
        if(done_received) break;
      }
      // Always clean up spinner when stream closes — even without a done event
      if(!done_received) {
        removeEl(thinkId);
        if(fullText) {
          addMarkdown(fullText);
          hist.push({role:'assistant', content: fullText});
        } else {
          addText('⚠️ 响应中断，请重试。');
        }
      }
    }
  } catch(err) {
    removeEl(thinkId);
    const msg2 = String(err);
    addText('⚠️ ' + (msg2.includes('超时') ? msg2 : '请求失败，请重试。'));
  }
}

function handleStreamEvent(ev, thinkId, msg) {
  if(ev.type === 'step') {
    updateThinkingStep(thinkId, ev);
  } else if(ev.type === 'done_prev') {
    markPrevStepDone(thinkId);
  } else if(ev.type === 'result') {
    removeEl(thinkId);
    const raw = ev.reply || '';
    const parsed = extractJSON(raw);
    if(parsed && parsed.type==='tabbed' && Array.isArray(parsed.tabs)) {
      addTabCard(parsed);
    } else {
      addText(raw || '⚠️ No response.');
    }
    hist.push({role:'assistant', content:raw});
  } else if(ev.type === 'error') {
    removeEl(thinkId);
    addText('⚠️ ' + (ev.message||'Error'));
  }
}

// ── STREAM STEP HELPERS ──────────────────────────────────────────────────────
function updateThinkingStep(thinkId, ev) {
  // The addThinking function already handles this via intervals
  // For SSE, we add steps directly
  const box = document.getElementById(thinkId+'-steps');
  if(!box) return;
  const row = document.createElement('div');
  row.className = 'flex items-start gap-2.5 step-row';
  row.innerHTML = `
    <div class="step-icon flex items-center justify-center flex-shrink-0 mt-0.5" style="width:14px;height:14px">
      <div class="spinner" style="width:12px;height:12px"></div>
    </div>
    <div class="flex-1 min-w-0">
      <div class="step-text text-xs font-medium leading-snug" style="color:#111827">${esc(ev.text||'')}</div>
      ${ev.src ? `<div class="text-[10px] mt-0.5" style="color:#1d4ed8">→ ${esc(ev.src)}</div>` : ''}
    </div>`;
  // Mark previous as done first
  const rows = box.querySelectorAll('.step-row');
  rows.forEach(r => {
    const icon = r.querySelector('.step-icon');
    if(icon && icon.querySelector('.spinner')) {
      icon.innerHTML = `<svg style="width:13px;height:13px;color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
      const txt = r.querySelector('.step-text');
      if(txt) txt.style.color='#6b7280';
    }
  });
  box.appendChild(row);
  scrollDown();
}

function markPrevStepDone(thinkId) {
  const box = document.getElementById(thinkId+'-steps');
  if(!box) return;
  box.querySelectorAll('.step-row').forEach(r => {
    const icon = r.querySelector('.step-icon');
    if(icon && icon.querySelector('.spinner')) {
      icon.innerHTML = `<svg style="width:13px;height:13px;color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
      const txt = r.querySelector('.step-text');
      if(txt) txt.style.color='#6b7280';
    }
  });
}

// ── EXTRACT JSON (robust) ────────────────────────────────────────────────────
function extractJSON(text) {
  if(!text) return null;
  // 1. direct parse
  try { return JSON.parse(text.trim()); } catch{}
  // 2. strip code fences (any variant)
  const stripped = text.replace(/^[\s\S]*?```(?:json)?\s*/,'').replace(/```[\s\S]*$/,'').trim();
  try { return JSON.parse(stripped); } catch{}
  // 3. find first { ... } block
  const m = text.match(/\{[\s\S]*\}/);
  if(m) { try { return JSON.parse(m[0]); } catch{} }
  return null;
}

// ── CLARIFY CARD (worker 返回 type:"clarify" 时出此卡) ─────────────────────────
function addClarifyCard(data) {
  const chat = document.getElementById('chat');
  const cid = 'clr-' + Date.now();
  const el = document.createElement('div');
  el.className = 'flex justify-start gap-2.5 fade-in';

  const opts = Array.isArray(data.options) ? data.options : [];
  const optHtml = opts.map((o, i) =>
    `<button onclick="clrPick('${cid}',${i})" class="w-full text-left flex items-start gap-3 p-3.5 rounded-2xl border transition-all hover:bg-blue-50 hover:border-blue-300" style="border-color:#e0e7ff;background:#f8faff">
      <span class="text-lg flex-shrink-0">${o.icon || '🏢'}</span>
      <div><div class="text-xs font-bold text-gray-900">${esc(o.label || '')}</div>
      <div class="text-[11px] text-gray-500 mt-0.5">${esc(o.desc || '')}</div></div>
    </button>`
  ).join('');

  const sugHtml = Array.isArray(data.followups) && data.followups.length
    ? `<div class="px-5 pb-4 pt-2 border-t border-gray-100">
        <div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Or try these</div>
        <div class="flex flex-wrap gap-2">
          ${data.followups.map(q => `<button onclick="sq('${esc(q)}')" class="text-xs px-3 py-1.5 rounded-xl border border-gray-200 text-gray-600 bg-slate-50 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200 transition-all">${esc(q)}</button>`).join('')}
        </div></div>` : '';

  el.innerHTML = `
    <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-1" style="background:#eff6ff">
      <span class="text-xs font-bold" style="color:#1d4ed8">A8</span>
    </div>
    <div class="flex-1 min-w-0 max-w-[92%] bg-white border border-gray-200 rounded-2xl rounded-tl-sm shadow-sm overflow-hidden">
      <div class="px-5 pt-4 pb-3 border-b border-gray-100" style="background:linear-gradient(to right,#fffbeb,#fff)">
        <div class="flex items-center gap-2 mb-1">
          <span class="text-base">❓</span>
          <span class="text-sm font-bold text-gray-900">Need a little more info</span>
        </div>

function isGenericBuyerQuery(msg) {
  const m = msg.toLowerCase().trim();
  const specificTopics = [
    'financial','revenue','sales','dpo','payment','credit','profit','income','margin',
    'sourcing','import','supply','supplier','country','origin','factory','vendor',
    'product','categor','buying','merchandise','assortment',
    'risk','compliance','requirement','standard',
    'news','signal','announcement','report','strateg','trend','overview',
    'compare','vs ','competitor','store','market cap','stock',
    '财务','收入','采购','风险','产品','新闻','竞争','概况'
  ];
  const genericPatterns = [
    /^tell me (more |something |sth )?(about|regarding)\s+\S/i,
    /^(what|who) (is|are|do you know about)\s+\S/i,
    /^(查|了解|介绍|分析|研究)\s*\S/,
    /^(give me|show me|get me) (some |more )?(info|information|intelligence|data|detail)(s)? (about|on|for|of)\s+\S/i,
    /^(research|look up|lookup)\s+\S/i,
    /^(what can you tell me about)\s+\S/i,
  ];
  if(!genericPatterns.some(p => p.test(msg))) return false;
  return !specificTopics.some(t => m.includes(t));
}

function extractBuyerName(msg) {
  let name = msg
    .replace(/^tell me (more |something |sth )?(about|regarding)\s*/i, '')
    .replace(/^(what|who) (is|are|do you know about)\s*/i, '')
    .replace(/^(查|了解|介绍|分析|研究)\s*/i, '')
    .replace(/^(give me|show me|get me) (some |more )?(info|information|intelligence|data|detail)(s)? (about|on|for|of)\s*/i, '')
    .replace(/^(research|look up|lookup)\s*/i, '')
    .replace(/^(what can you tell me about)\s*/i, '')
    .replace(/\?+$/, '')
    .trim();
  // Stop at possessive ('s ...) — buyer names don't include topic phrases
  name = name.replace(/'s\s+.+$/i, '').trim();
  name = name.replace(/\s+(and|with|vs\.?|versus|including)\s+.+$/i, '').trim();
  // Cap at 3 words max
  const words = name.split(/\s+/);
  if(words.length > 3) name = words.slice(0, 3).join(' ');
  return name || msg.trim();
}

    const a = parts?.[1]?.trim()||'Buyer A', b = parts?.[2]?.trim()||'Buyer B';

      { text: 'Pulling financial profiles & DPO data', src: 'Public filings' },
      { text: 'Cross-referencing sourcing & customs records', src: 'Customs DB' },
      { text: 'Composing side-by-side analysis', src: null },

function addThinking(steps) {
  const chat=document.getElementById('chat');
  const id='think-'+Date.now();
  const el=document.createElement('div');
  el.id=id; el.className='flex justify-start gap-2.5 fade-in';

  el.innerHTML=`
    <div class="w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 mt-1" style="background:#eff6ff">
      <span class="text-xs font-bold" style="color:#1d4ed8">A8</span>
    </div>
    <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-sm shadow-sm overflow-hidden" style="min-width:290px;max-width:380px">
      <div class="px-4 py-2 border-b border-gray-100 flex items-center gap-2" style="background:#f8faff">
        <div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div>
        <span class="text-[11px] font-semibold" style="color:#1d4ed8">Researching…</span>
        <span id="${id}-timer" class="text-[10px] text-gray-400 ml-auto">1s</span>
      </div>
      <div class="px-4 py-3 space-y-2" id="${id}-steps"></div>
    </div>`;
  chat.appendChild(el);
  scrollDown();

  // Real-time timer
  if(!window._thinkTimers) window._thinkTimers = {};
  let _secs = 1;
  window._thinkTimers[id] = setInterval(() => {
    _secs++;
    const t = document.getElementById(id+'-timer');
    if(t) t.textContent = _secs+'s';
  }, 1000);

  const TICK = 850;
  steps.forEach((step,i) => {
    setTimeout(() => {
      const box=document.getElementById(`${id}-steps`);
      if(!box) return;

      // Mark previous step done
      const prev=document.getElementById(`${id}-step-${i-1}`);
      if(prev) {
        const icon=prev.querySelector('.step-icon');
        if(icon) icon.innerHTML=`<svg style="width:13px;height:13px;color:#16a34a" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>`;
        const txt=prev.querySelector('.step-text');
        if(txt) txt.style.color='#6b7280';
      }

      // New step
      const row=document.createElement('div');
      row.id=`${id}-step-${i}`;
      row.className='flex items-start gap-2.5 step-row';
      row.innerHTML=`
        <div class="step-icon flex items-center justify-center flex-shrink-0 mt-0.5" style="width:14px;height:14px">
          <div class="spinner" style="width:12px;height:12px"></div>
        </div>
        <div class="flex-1 min-w-0">
          <div class="step-text text-xs font-medium leading-snug" style="color:#111827">${esc(step.text)}</div>
          ${step.src ? `<div class="text-[10px] mt-0.5" style="color:#1d4ed8">→ ${esc(step.src)}</div>` : ''}
        </div>`;
      box.appendChild(row);
      scrollDown();
    }, i * TICK);
  });

  return id;
}

function parseMarkdown(md) {
  // Process line by line for better control
  const lines = md.split('\n');
  let html = '';
  let inTable = false, tableRows = [];
  let inList = false, listItems = [];

  const flushTable = () => {
    if(!tableRows.length) return;
    const [header, , ...body] = tableRows;
    const ths = header.split('|').slice(1,-1).map(c=>`<th class="px-4 py-2 text-left text-[10px] font-bold text-gray-500 uppercase bg-slate-50 border-b border-gray-200">${esc(c.trim())}</th>`).join('');
    const rows = body.map((r,ri)=>
      `<tr class="${ri%2?'bg-slate-50/40':'bg-white'}">` +
      r.split('|').slice(1,-1).map(c=>{
        const v=c.trim();
        const cls=v.startsWith('↑')?'text-emerald-600 font-semibold':v.startsWith('↓')?'text-red-500 font-semibold':'text-gray-700';
        return `<td class="px-4 py-2.5 text-xs ${cls} border-b border-gray-100">${esc(v)}</td>`;
      }).join('')+`</tr>`).join('');
    html += `<div class="overflow-hidden rounded-xl border border-gray-200 my-3 shadow-sm"><table class="w-full"><thead><tr>${ths}</tr></thead><tbody>${rows}</tbody></table></div>`;
    tableRows = []; inTable = false;
  };

  const flushList = () => {
    if(!listItems.length) return;

    // 💬 Suggested questions (from 7-dim Layer 1 or drill-down follow-ups)
    const isSuggestedQ = listItems.some(l => l.trimStart().startsWith('💬'));
    if(isSuggestedQ) {
      const chips = listItems
        .filter(l => l.trimStart().startsWith('💬'))
        .map(item => {
          const q = item.replace(/^💬\s*/, '').trim();
          return `<button class="explore-chip text-left w-full px-3 py-2 text-xs rounded-xl border border-blue-100 text-blue-700 bg-blue-50 hover:bg-blue-100 hover:border-blue-300 transition-all" data-query="${esc(q)}">${esc(q)}</button>`;
        }).join('');
      html += `<div class="mt-3 mb-2 p-3 bg-slate-50 border border-slate-200 rounded-xl">
        <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">💡 Explore further</div>
        <div class="flex flex-col gap-1.5">${chips}</div>
      </div>`;
      listItems = []; inList = false; return;
    }

    // Check if these are "Explore further" items
    const isExplore = listItems.some(l => /💰|📦|🌍|⚠️|📰|🥊/.test(l));
    if(isExplore) {
      const chips = listItems.map(item => {
        const iconMatch = item.match(/^(💰|📦|🌍|⚠️|📰|🥊)/);
        const icon = iconMatch ? iconMatch[0] : '';
        const labelMatch = item.match(/\*\*(.+?)\*\*/);
        const label = labelMatch ? labelMatch[1] : item.replace(/^[💰📦🌍⚠️📰🥊]\s*/,'').split('—')[0].trim();
        const qMap = {
          'Financials':'Tell me more about their financials and credit profile',
          '财务':'能否深入介绍他们的财务情况',
          'Products':'Tell me about their products and categories',
          '产品':'能否深入介绍他们的产品品类',
          'Sourcing':'Tell me about their sourcing and supply chain',
          '采购':'能否深入介绍他们的采购来源',
          'Risk':'What are their compliance and risk requirements for suppliers',
          '风险':'能否详细介绍他们对供应商的合规要求',
          'Signals':'What are the latest news and signals',
          '信号':'最近有什么动态',
          'Competitors':'Compare them to their main competitors',
          '竞争':'和主要竞争对手相比如何',
        };
        const q = qMap[label.split(' &')[0].trim()] || `Tell me more about ${label.toLowerCase()}`;
        return `<button class="explore-chip text-left px-3 py-1.5 text-xs rounded-xl border border-gray-200 text-gray-600 bg-slate-50 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-200 transition-all" data-query="${esc(q)}">${icon} ${esc(label)}</button>`;
      }).join('');
      html += `<div class="mt-2 mb-1"><div class="text-[10px] font-semibold text-gray-400 uppercase tracking-wider mb-2">Explore further</div><div class="flex flex-wrap gap-2">${chips}</div></div>`;
    } else {
      html += '<ul class="space-y-1 my-2">' + listItems.map(l=>`<li class="flex gap-2 text-sm text-gray-600"><span class="text-gray-400 mt-0.5">•</span><span>${inlineFormat(l)}</span></li>`).join('') + '</ul>';
    }
    listItems = []; inList = false;
  };

  for(let i=0; i<lines.length; i++) {
    const line = lines[i];
    const trimmed = line.trim();

    // Table rows
    if(trimmed.startsWith('|') && trimmed.endsWith('|')) {
      if(!inTable) { flushList(); inTable = true; }
      tableRows.push(trimmed);
      continue;
    } else if(inTable) { flushTable(); }

    // List items
    if(trimmed.startsWith('- ') || trimmed.startsWith('• ')) {
      if(!inList) inList = true;
      listItems.push(trimmed.replace(/^[-•]\s+/,''));
      continue;
    } else if(inList) { flushList(); }

    // Headings
    if(trimmed.startsWith('# ')) {
      html += `<div class="mb-3"><span class="text-lg font-black text-gray-900">${inlineFormat(trimmed.slice(2))}</span></div>`;
    } else if(trimmed.startsWith('## ')) {
      html += `<div class="text-sm font-bold text-gray-800 mt-4 mb-2">${inlineFormat(trimmed.slice(3))}</div>`;
    } else if(trimmed.startsWith('### ')) {
      html += `<div class="text-xs font-semibold text-gray-600 mt-3 mb-1 uppercase tracking-wide">${inlineFormat(trimmed.slice(4))}</div>`;
    }
    // HR
    else if(trimmed === '---' || trimmed === '***') {
      html += '<hr class="my-3 border-gray-100">';
    }
    // Bold headline (starts and ends with **)
    else if(trimmed.startsWith('**') && trimmed.endsWith('**') && trimmed.length > 4) {
      html += `<div class="flex gap-2 p-3.5 rounded-xl my-3" style="background:#eff6ff;border:1px solid #bfdbfe"><svg class="w-4 h-4 flex-shrink-0 mt-0.5" style="color:#1d4ed8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg><p class="text-xs font-semibold leading-relaxed" style="color:#1e3a8a">${inlineFormat(trimmed.slice(2,-2))}</p></div>`;
    }
    // Source line (starts with *)
    else if(trimmed.startsWith('*Source:') || trimmed.startsWith('*Data:')) {
      html += `<p class="text-[10px] text-gray-400 mt-2 leading-relaxed">${inlineFormat(trimmed.slice(1,-1))}</p>`;
    }
    // Regular paragraph
    else if(trimmed) {
      html += `<p class="text-sm text-gray-600 leading-relaxed my-1.5">${inlineFormat(trimmed)}</p>`;
    }
  }
  flushTable(); flushList();
  return html;
}

function inlineFormat(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+?)\*/g,'<em>$1</em>')
    .replace(/`([^`]+?)`/g,'<code class="bg-gray-100 px-1 rounded text-[11px]">$1</code>');
}

function statColor(label, value) {
  const l = (label || '').toLowerCase();
  if(/dpo|late|risk|debt|dilution/.test(l)) return { bg: '#fff7ed', border: '#fed7aa', numColor: '#c2410c' };
  if(/revenue|sales|ocf|fcf|cash flow/.test(l)) return { bg: '#f0fdf4', border: '#bbf7d0', numColor: '#15803d' };
  if(/s&p|rating|credit|moody/.test(l)) return { bg: '#eff6ff', border: '#bfdbfe', numColor: '#1d4ed8' };
  return { bg: '#ffffff', border: '#f3f4f6', numColor: '#111827' };
}

// ── PANEL BUILDER ─────────────────────────────────────────────────────────────
const FLAGS={'china':'🇨🇳','vietnam':'🇻🇳','bangladesh':'🇧🇩','india':'🇮🇳','cambodia':'🇰🇭','indonesia':'🇮🇩','turkey':'🇹🇷','pakistan':'🇵🇰','morocco':'🇲🇦','sri lanka':'🇱🇰','other':'🌐','mexico':'🇲🇽','us':'🇺🇸','usa':'🇺🇸'};
function flag(n){return FLAGS[(n||'').toLowerCase().replace(/[^a-z ]/g,'')]||'';}



function renderAnalysisText(txt) {
  if(!txt) return '';
  // Strip markdown bold for processing, preserve for display
  var raw = txt;
  // Step 1: determine split mode
  var hasBullet = raw.includes('\u2022') || /\n\s*[-•]/.test(raw);
  var parts;
  if(raw.includes('\n')) {
    parts = raw.split(/\n/).map(s=>s.trim()).filter(s=>s);
    if(!hasBullet) {
      // Newlines but no bullets — flatten then sentence-split
      var flat = parts.join(' ');
      parts = sentenceSplit(flat);
    }
  } else if(hasBullet) {
    // Inline bullets: split on •
    parts = raw.split(/\s*\u2022\s*/).map(s=>s.trim()).filter(s=>s);
  } else {
    // Plain paragraph — sentence split
    parts = sentenceSplit(raw);
  }
  var headline='', bullets=[], actionLine='';
  var isFirst=true;
  parts.forEach(function(part){
    var line=part.trim();
    if(!line) return;
    var isBullet=line.charAt(0)==='\u2022'||line.startsWith('- ');
    var clean=isBullet?line.replace(/^[\u2022\-]\s*/,'').trim():line;
    if(/^(SUPPLIER ACTION|AIR8 RECOMMENDATION|RECOMMENDED|AIR8行动):/i.test(clean)){
      actionLine=clean; isFirst=false; return;
    }
    if(isFirst&&!isBullet){ headline=clean; isFirst=false; return; }
    isFirst=false;
    if(clean) bullets.push(clean);
  });
  // If only one "bullet" and it's long — it's actually the headline
  if(!headline && bullets.length===1 && bullets[0].length>80) {
    headline=bullets[0]; bullets=[];
  }
  var h='';
  if(headline) h+='<div class="text-[11px] font-bold text-gray-700 mb-2.5 pb-1.5 border-b border-gray-100 leading-snug">'+renderBold(headline)+'</div>';
  if(bullets.length){
    h+='<div class="space-y-1.5 mb-3">';
    bullets.forEach(function(b){
      var ci=b.indexOf(':');
      var hasLabel=ci>0&&ci<55&&!/https?:\/\//.test(b.slice(0,ci));
      if(hasLabel){
        var lbl=b.slice(0,ci).trim();
        var body=b.slice(ci+1).trim();
        h+='<div class="p-2.5 rounded-xl text-xs leading-relaxed" style="background:#f8faff;border:1px solid #e0e7ff">'
          +'<span class="font-bold text-gray-800">'+esc(lbl)+':</span>'
          +' <span class="text-gray-600">'+renderBold(body)+'</span></div>';
      } else {
        h+='<div class="flex gap-2 items-start p-2.5 rounded-xl text-xs text-gray-600 leading-relaxed" style="background:#f8faff;border:1px solid #e0e7ff">'
          +'<span class="flex-shrink-0 w-1.5 h-1.5 rounded-full mt-1.5" style="background:#1d4ed8"></span>'
          +'<span>'+renderBold(b)+'</span></div>';
      }
    });
    h+='</div>';
  }
  if(actionLine){
    var cleaned=actionLine.replace(/^(SUPPLIER ACTION|AIR8 RECOMMENDATION|RECOMMENDED|AIR8行动):\s*/i,'').trim();
    h+='<div class="flex gap-2.5 p-3 rounded-xl mb-2" style="background:#fff7ed;border:1px solid #fed7aa">'
      +'<span style="font-size:15px;flex-shrink:0">\u26a1</span>'
      +'<div><div class="text-[10px] font-bold mb-0.5" style="color:#c2410c">SUPPLIER ACTION</div>'
      +'<div class="text-xs leading-relaxed" style="color:#92400e">'+renderBold(cleaned)+'</div></div></div>';
  }
  return h || '<p class="text-xs text-gray-600 leading-relaxed mb-3">'+renderBold(txt)+'</p>';
}

// Split a paragraph into sentences, skipping common abbreviations
function sentenceSplit(text) {
  // Split on '. ' or '.' at end, avoiding U.S. / e.g. / Dr. etc.
  var parts = text.split(/(?<=[^A-Z][.!?])\s+(?=[A-Z\u4e00-\u9fff])/);
  if(parts.length < 2) {
    // Fallback: split on ' — ' or '; '
    parts = text.split(/\s+[—–]\s+|\s*;\s+/);
  }
  return parts.map(s=>s.trim()).filter(s=>s.length>15);
}

// Render **bold** markdown within escaped text
function renderBold(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}

function buildTreemap(chart) {
  if(!chart || !Array.isArray(chart.values) || chart.values.length===0) return '';
  var BPAL=['#3b5fe0','#e53e3e','#dd6b20','#38a169','#6d28d9','#0891b2','#dc2626','#059669','#d97706'];
  var vals=chart.values||[], lbls=chart.labels||[];
  var total=vals.reduce(function(a,b){return a+b;},0)||100;
  var items=lbls.map(function(l,i){return{l:l,v:vals[i]||0,pct:Math.round((vals[i]||0)/total*100),c:BPAL[i%BPAL.length]};}).sort(function(a,b){return b.v-a.v;});
  var topRow=[],botRow=[],cum=0;
  items.forEach(function(it){if(cum<62&&topRow.length<4){topRow.push(it);cum+=it.pct;}else botRow.push(it);});
  function mkBlock(it,fs1,fs2,pad,height){
    return '<div style="flex:'+it.v+';min-width:32px;background:'+it.c+';display:flex;flex-direction:column;justify-content:flex-end;padding:'+pad+';color:#fff;height:'+height+'">'
      +'<div style="font-size:'+fs1+'px;font-weight:800;line-height:1">'+it.pct+'%</div>'
      +'<div style="font-size:'+fs2+'px;opacity:0.85;line-height:1.2;margin-top:1px;overflow:hidden">'+esc(it.l)+'</div>'
      +'</div>';
  }
  var topBlocks=topRow.map(function(it){return mkBlock(it,14,10,'10px 8px','100%');}).join('');
  var botBlocks=botRow.length?'<div style="display:flex;gap:2px;flex:38">'+botRow.map(function(it){return mkBlock(it,10,9,'6px 6px','100%');}).join('')+'</div>':'';
  var topFlex=botRow.length?62:100;
  var titleHtml=chart.title?'<div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">'+esc(chart.title)+'</div>':'';
  return '<div class="mb-4 bg-white rounded-2xl border border-gray-100 shadow-sm p-4">'
    +titleHtml
    +'<div style="display:flex;flex-direction:column;gap:2px;height:170px;border-radius:10px;overflow:hidden">'
    +'<div style="display:flex;gap:2px;flex:'+topFlex+'">'+topBlocks+'</div>'
    +botBlocks
    +'</div></div>';
}

function buildStoreMap(pts) {
  if(!Array.isArray(pts)||pts.length===0) return '';
  var sorted=[...pts].sort((a,b)=>(b.count||0)-(a.count||0));
  var max=sorted[0].count||1;
  var PAL=['#2563eb','#1d9bcf','#6d28d9','#0f766e','#b45309','#dc2626','#be185d','#475569'];
  const W=560,H=270;
  function px(lat,lon){return[(( lon+180)/360*W).toFixed(1),((90-lat)/180*H).toFixed(1)];}

  // Continent + island paths — gray fill, white ocean background
  // Coordinates verified against Mercator projection
  var lands = [
    // North America (main body)
    `M ${px(72,-95)} L ${px(63,-64)} L ${px(48,-53)} L ${px(43,-65)} L ${px(25,-80)} L ${px(15,-85)} L ${px(20,-105)} L ${px(30,-117)} L ${px(50,-128)} L ${px(60,-137)} L ${px(70,-140)} Z`,
    // South America
    `M ${px(12,-72)} L ${px(5,-52)} L ${px(-5,-35)} L ${px(-22,-42)} L ${px(-35,-58)} L ${px(-55,-68)} L ${px(-47,-75)} L ${px(-18,-70)} L ${px(0,-78)} Z`,
    // Europe
    `M ${px(71,26)} L ${px(60,30)} L ${px(55,24)} L ${px(48,22)} L ${px(36,28)} L ${px(36,-6)} L ${px(44,-10)} L ${px(51,-5)} L ${px(58,5)} L ${px(62,5)} Z`,
    // Scandinavia ext
    `M ${px(58,5)} L ${px(71,26)} L ${px(68,18)} L ${px(62,10)} Z`,
    // Africa
    `M ${px(37,10)} L ${px(37,36)} L ${px(22,38)} L ${px(11,44)} L ${px(0,42)} L ${px(-12,40)} L ${px(-35,26)} L ${px(-34,18)} L ${px(-22,14)} L ${px(0,8)} L ${px(15,-17)} L ${px(22,-17)} L ${px(37,-2)} Z`,
    // Asia (main)
    `M ${px(72,140)} L ${px(62,165)} L ${px(50,140)} L ${px(35,138)} L ${px(22,120)} L ${px(1,104)} L ${px(8,78)} L ${px(22,72)} L ${px(28,48)} L ${px(38,26)} L ${px(42,42)} L ${px(52,60)} L ${px(68,68)} L ${px(72,100)} Z`,
    // Indian subcontinent
    `M ${px(28,72)} L ${px(24,90)} L ${px(8,78)} L ${px(14,74)} Z`,
    // SE Asia
    `M ${px(20,100)} L ${px(14,106)} L ${px(5,104)} L ${px(1,108)} L ${px(-8,118)} L ${px(-8,104)} L ${px(5,100)} Z`,
    // Australia
    `M ${px(-12,130)} L ${px(-12,152)} L ${px(-24,154)} L ${px(-38,146)} L ${px(-38,128)} L ${px(-22,114)} Z`,
    // Greenland
    `M ${px(76,-45)} L ${px(84,-30)} L ${px(80,-18)} L ${px(68,-24)} L ${px(68,-42)} Z`,
    // Japan
    `M ${px(40,140)} L ${px(36,136)} L ${px(31,130)} L ${px(32,132)} L ${px(38,141)} Z`,
    // UK
    `M ${px(58,-4)} L ${px(51,-5)} L ${px(51,1)} L ${px(56,0)} Z`,
    // New Zealand
    `M ${px(-34,172)} L ${px(-40,174)} L ${px(-46,168)} L ${px(-36,172)} Z`,
    // Iceland
    `M ${px(64,-24)} L ${px(66,-14)} L ${px(63,-13)} L ${px(63,-24)} Z`,
    // Madagascar
    `M ${px(-12,44)} L ${px(-18,47)} L ${px(-26,44)} L ${px(-18,43)} Z`,
  ].map(d=>`<path d="${d.replace(/,/g,' ')}" fill="#d9d9d9" stroke="#c0c0c0" stroke-width="0.5" stroke-linejoin="round"/>`).join('');

  // Graticule (subtle lat/lon grid lines)
  var grid = '';
  for(var lon=-180;lon<=180;lon+=60){var[gx]=px(0,lon);grid+=`<line x1="${gx}" y1="0" x2="${gx}" y2="${H}" stroke="#e8e8e8" stroke-width="0.5"/>`;}
  for(var lat=-60;lat<=60;lat+=30){var[,gy]=px(lat,0);grid+=`<line x1="0" y1="${gy}" x2="${W}" y2="${gy}" stroke="#e8e8e8" stroke-width="0.5"/>`;}

  var circles = sorted.map((p,i)=>{
    if(p.lat==null||p.lon==null) return '';
    var [x,y]=px(p.lat,p.lon).map(Number);
    var r=Math.max(10,Math.min(50,Math.sqrt((p.count||1)/max)*50));
    var col=PAL[i%PAL.length];
    var pctTxt=p.pct?p.pct+'%':(p.count||'');
    var ly=Math.min(H-6, y+r+11);
    return `<g>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${col}" fill-opacity="0.82" stroke="white" stroke-width="2"/>
      <text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="${r>17?11:9}" font-weight="800" font-family="-apple-system,sans-serif">${pctTxt}</text>
      <text x="${x}" y="${ly}" text-anchor="middle" fill="#374151" font-size="9" font-weight="700" font-family="-apple-system,sans-serif" paint-order="stroke" stroke="rgba(255,255,255,0.9)" stroke-width="3">${esc(p.label||'')}</text>
    </g>`;
  }).join('');

  var legend = sorted.map((p,i)=>`<span class="inline-flex items-center gap-1.5 text-[10px] text-gray-600">
    <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background:${PAL[i%PAL.length]}"></span>
    <span class="font-semibold text-gray-700">${esc(p.label||'')}</span>
    <span class="text-gray-400">${p.count?.toLocaleString?.()??p.count}${p.pct?' ('+p.pct+'%)':''}</span>
  </span>`).join('');

  return `<div class="mb-4 rounded-2xl overflow-hidden" style="border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,.06)">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:#f9fafb">
      ${grid}
      ${lands}
      ${circles}
    </svg>
    <div class="flex flex-wrap gap-x-4 gap-y-1 px-3 py-2" style="background:#fff;border-top:1px solid #f1f5f9">
      ${legend}
    </div>
  </div>`;
}


function buildPanel(tab, cid) {
  try {
  let h='';

  // Insight box
  if(tab.insight) h+=`
    <div class="flex gap-3 p-4 rounded-2xl mb-4 border" style="background:#eff6ff;border-color:#bfdbfe">
      <svg class="w-4 h-4 mt-0.5 flex-shrink-0" style="color:#1d4ed8" fill="currentColor" viewBox="0 0 20 20">
        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
      </svg>
      <p class="text-xs leading-relaxed font-medium" style="color:#1e3a8a">${esc(tab.insight)}</p>
    </div>`;

  // Stats
  if(tab.stats&&tab.stats.length) {
    h+=`<div class="grid grid-cols-2 gap-3 mb-4">`;
    tab.stats.forEach(s=>{
      const sc = statColor(s.label, s.value);
      h+=`<div class="rounded-2xl p-3.5 border shadow-sm" style="background:${sc.bg};border-color:${sc.border}">
        <div class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider mb-1">${esc(s.label)}</div>
        <div class="text-xl font-black" style="color:${sc.numColor}">${esc(s.value)}</div>
        ${s.delta?`<div class="text-xs font-semibold mt-1" style="color:#16a34a">${esc(s.delta)}</div>`:''}
      </div>`;
    });
    h+=`</div>`;
  }

  // Free text
  if(tab.text) h+=renderAnalysisText(tab.text);

  // Charts array (multiple charts per tab, e.g. financial drill-down)
  if(tab.charts && Array.isArray(tab.charts)) {
    tab.charts.forEach((c, ci) => {
      if(c.type === 'block') {
        h += buildTreemap(c);
      } else {
        const canvasId = `${cid}-chart-${tab.id}-${ci}`;
        const h2 = Math.round(c.type === 'grouped_bar' ? 190 : 160);
        h+=`<div class="mb-4 bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
          ${c.title?`<div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-3">${esc(c.title)}</div>`:''}
          <div style="height:${h2}px"><canvas id="${canvasId}"></canvas></div>
        </div>`;
      }
    });
  }

  // Chart placeholder (single chart)
  if(tab.chart) {
    if(tab.chart.type==='block') {
      // 2D treemap — uses buildTreemap() for proper 2-row layout
      h += buildTreemap(tab.chart);
    } else {
      h+=`<div class="mb-4 bg-white rounded-2xl border border-gray-100 shadow-sm p-4">
        ${tab.chart.title?`<div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-3">${esc(tab.chart.title)}</div>`:''}
        <div style="height:${tab.chart.type==='grouped_bar'?190:160}px">
          <canvas id="${cid}-chart-${tab.id}"></canvas>
        </div>
      </div>`;
    }
  }

  // Country tiles for sourcing
  if(tab.id==='sourcing'&&tab.chart&&tab.chart.labels) {
    const total=tab.chart.values.reduce((a,b)=>a+b,0)||100;
    h+=`<div class="grid grid-cols-2 gap-2 mb-4">`;
    tab.chart.labels.forEach((lbl,i)=>{
      const pct=tab.chart.values[i]||0, bar=Math.round(pct/total*100);
      h+=`<div class="bg-white rounded-xl border border-gray-100 p-3 shadow-sm">
        <div class="flex items-center gap-1.5 mb-2">
          <span class="text-base">${flag(lbl)}</span>
          <span class="text-xs font-semibold text-gray-800">${esc(lbl)}</span>
          <span class="ml-auto text-xs font-black" style="color:#1d4ed8">${pct}%</span>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-1.5">
          <div class="h-1.5 rounded-full" style="width:${bar}%;background:#1d4ed8"></div>
        </div>
      </div>`;
    });
    h+=`</div>`;
  }

  // Table (main)
  if(tab.table) h+=buildTable(tab.table);

  // Segment table (revenue breakdown by segment, e.g. P&L tab)
  if(tab.segment_table) {
    h+=`<div class="mb-4">
      ${tab.segment_table.title?`<div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">${esc(tab.segment_table.title)}</div>`:''}
    </div>`;
    h+=buildTable(tab.segment_table);
  }

  // Category table (products tab — growth rates, price points, supply chain notes)
  if(tab.category_table) {
    h+=`<div class="mb-4">
      <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Category Detail</div>
    </div>`;
    h+=buildTable(tab.category_table);
  }

  // Risk grid
  if(tab.risks&&tab.risks.length) {
    h+=`<div class="grid grid-cols-2 gap-3 mb-4">`;
    tab.risks.forEach(r=>{
      const lv=r.level||'';
      const cls=lv==='Low'?'risk-low':lv==='High'?'risk-high':'risk-med';
      const dot=lv==='Low'?'#16a34a':lv==='High'?'#be123c':'#b45309';
      h+=`<div class="p-3 rounded-2xl border ${cls}">
        <div class="flex items-center gap-1.5 mb-1.5">
          <div class="w-2 h-2 rounded-full flex-shrink-0" style="background:${dot}"></div>
          <span class="text-[11px] font-bold">${esc(r.label)}</span>
          <span class="ml-auto text-[10px] font-black uppercase">${esc(lv)}</span>
        </div>
        <div class="text-[11px] leading-relaxed opacity-80">${esc(r.note||'')}</div>
      </div>`;
    });
    h+=`</div>`;
  }

  // Signals
  if(tab.signals&&tab.signals.length) {
    h+=`<div class="space-y-3">`;
    const tmap={COMPANY:{bg:'#eff6ff',border:'#bfdbfe',tag:'#1d4ed8',ico:'🏢'},REGULATORY:{bg:'#faf5ff',border:'#e9d5ff',tag:'#7e22ce',ico:'⚖️'},MARKET:{bg:'#fffbeb',border:'#fde68a',tag:'#b45309',ico:'📈'}};
    tab.signals.forEach(s=>{
      const t=tmap[s.type]||tmap.MARKET;
      h+=`<div class="rounded-2xl border p-4" style="background:${t.bg};border-color:${t.border}">
        <div class="flex items-center gap-2 mb-2">
          <span>${t.ico}</span>
          <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold text-white" style="background:${t.tag}">${esc(s.type)}</span>
          <span class="ml-auto text-[10px] text-gray-400">${esc(s.date||'')}</span>
        </div>
        <div class="text-xs font-semibold text-gray-900 mb-1.5">${esc(s.title||'')}</div>
        <div class="text-[11px] text-gray-600 leading-relaxed pt-1.5 border-t" style="border-color:${t.border}">${esc(s.impact||'')}</div>
        ${s.source?`<div class="flex items-center gap-1.5 mt-2 pt-1.5 border-t" style="border-color:${t.border}">
          <svg class="w-3 h-3 flex-shrink-0" style="color:#9ca3af" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
          ${s.source_url?`<a href="${esc(s.source_url)}" target="_blank" rel="noopener" class="text-[10px] font-medium hover:underline" style="color:#6b7280">${esc(s.source)}</a>`:`<span class="text-[10px]" style="color:#9ca3af">${esc(s.source)}</span>`}
        </div>`:''}
      </div>`;
    });
    h+=`</div>`;
  }


  // Key Takeaways bullets
  if(tab.bullets && tab.bullets.length) {
    h+=`<div class="space-y-2.5 mb-4">`;
    tab.bullets.forEach(b=>{
      h+=`<div class="flex gap-3 p-3 rounded-xl" style="background:#f8faff;border:1px solid #e0e7ff">
        <div class="w-4 h-4 rounded-full flex-shrink-0 mt-0.5 flex items-center justify-center" style="background:#1d4ed8">
          <svg style="width:8px;height:8px;color:white" fill="currentColor" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"/></svg>
        </div>
        <p class="text-xs text-gray-700 leading-relaxed">${esc(b)}</p>
      </div>`;
    });
    h+=`</div>`;
  }

  // Direction picker (explore_options)
  if(tab.explore_options && tab.explore_options.length) {
    var opts = tab.explore_options;
    h += '<div class="space-y-2 mb-4" id="explore-opts-'+cid+'">';
    opts.forEach(function(o,i){
      h += '<label class="flex gap-3 items-start p-3 rounded-xl cursor-pointer hover:bg-blue-50 transition-all" style="border:1px solid #e0e7ff;background:#f8faff" onclick="toggleExplore(this)">'
        + '<span class="mt-0.5 w-4 h-4 rounded border-2 flex-shrink-0 flex items-center justify-center transition-all" style="border-color:#c7d2fe" data-check="'+esc(o.id)+'">​</span>'
        + '<div><div class="text-xs font-bold text-gray-800">'+esc(o.title||'')+'</div>'
        + '<div class="text-[11px] text-gray-500 mt-0.5">'+esc(o.desc||'')+'</div></div>'
        + '</label>';
    });
    h += '</div>';
    h += '<div class="flex justify-end gap-3 mt-2">'
      + '<button onclick="skipExplore()" class="text-xs text-gray-400 px-4 py-2 rounded-xl hover:text-gray-600">Skip</button>'
      + '<button data-cid="'+cid+'" onclick="continueExplore(this.dataset.cid)" class="text-xs font-semibold text-white px-5 py-2 rounded-xl transition-all" style="background:#1d4ed8">Continue →</button>'
      + '</div>';
  }

  // Coverage gaps
  if(tab.coverage_gaps) {
    h+=`<div class="flex gap-2.5 p-3 rounded-xl border" style="background:#fffbeb;border-color:#fde68a">
      <svg class="w-4 h-4 flex-shrink-0 mt-0.5" style="color:#b45309" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <div>
        <div class="text-[10px] font-bold text-amber-700 mb-0.5 uppercase tracking-wide">Data coverage note</div>
        <p class="text-[11px] text-amber-800 leading-relaxed">${esc(tab.coverage_gaps)}</p>
      </div>
    </div>`;
  }

  return h;
  } catch(e) { console.error("buildPanel error:", e); return "<p class='text-xs text-red-400 p-3'>Card render error — check console</p>"; }
}

// ── TABLE ────────────────────────────────────────────────────────────────────
function buildTable(t) {
  if(!t||!t.headers) return '';
  const heads=t.headers.map(h=>`<th class="px-4 py-2.5 text-left text-[10px] font-bold uppercase tracking-wider text-gray-500 bg-slate-50 border-b border-gray-200">${esc(h)}</th>`).join('');
  const rows=(t.rows||[]).map((r,ri)=>
    `<tr class="${ri%2===0?'bg-white':'bg-slate-50/60'} hover:bg-blue-50/30 transition-colors">
      ${r.map((c,ci)=>{
        const up=String(c).startsWith('↑'), dn=String(c).startsWith('↓');
        const cls=up?'font-semibold" style="color:#16a34a':dn?'font-semibold" style="color:#be123c':ci===0?'font-medium text-gray-800':'text-gray-600';
        return `<td class="px-4 py-2.5 text-xs ${cls} border-b border-gray-100">${esc(c)}</td>`;
      }).join('')}
    </tr>`).join('');
  return `<div class="overflow-hidden rounded-2xl border border-gray-200 shadow-sm mt-3">
    <table class="w-full"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

// ── CHARTS ────────────────────────────────────────────────────────────────────
// ── CHART TYPE RULES (HARD) ─────────────────────────────────────────────────
// Rule 1: country/origin/distribution → ALWAYS doughnut
// Rule 2: trend/revenue/time-series   → ALWAYS bar_line (bar + line overlay)
function enforceChartType(c) {
  if(!c || typeof c !== 'object') return c || {};
  // Handle combo/bars+lines format → convert to bar_line_dual
  if(c.bars && Array.isArray(c.bars) && c.lines && Array.isArray(c.lines)) {
    const barDs = c.bars[0] || {};
    const lineDs = c.lines[0] || {};
    return Object.assign({}, c, {
      type: 'bar_line_dual',
      bar_values: barDs.values || [],
      bar_label: barDs.label || c.title || 'Value',
      line_values: lineDs.values || [],
      line_label: lineDs.label || 'Margin (%)'
    });
  }
  const t = (c.title||'').toLowerCase();
  const labels = Array.isArray(c.labels) ? c.labels : [];
  const isCountry = /country|origin|sourcing.mix|import.mix|distribution|by country|by region/.test(t)
    || labels.filter(l=>/^(china|vietnam|bangladesh|india|usa|us|cambodia|mexico|turkey|indonesia|pakistan|other|eu|europe)$/i.test(String(l).trim())).length >= 2;
  const isTrend = /trend|fy20|q[1-4].*20[12]|revenue.*\$|annual.*\$/.test(t)
    || labels.filter(l=>/^(FY|Q)\d|^20\d\d/.test(String(l))).length >= 2;
  if(isCountry && c.type!=='grouped_bar') return Object.assign({},c,{type:'doughnut'});
  if(isTrend && c.type==='bar') return Object.assign({},c,{type:'bar_line'});
  return c;
}

const DPAL=['#1d4ed8','#0ea5e9','#8b5cf6','#10b981','#f59e0b','#ef4444','#ec4899','#64748b'];

function doughnutCfg(c) {
  return {
    type:'doughnut',
    data:{labels:c.labels,datasets:[{data:c.values,backgroundColor:DPAL.slice(0,c.values.length),borderWidth:3,borderColor:'#fff',hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
      plugins:{
        legend:{position:'bottom',labels:{font:{size:11},color:'#475569',boxWidth:12,padding:12,usePointStyle:true}},
        tooltip:{backgroundColor:'#1e293b',callbacks:{label:ctx=>`${ctx.label}: ${ctx.parsed}%`}},
        datalabels:{display:ctx=>ctx.dataset.data[ctx.dataIndex]>=4,color:'#fff',font:{size:11,weight:'bold'},formatter:v=>v+'%'}
      }}
  };
}

function barLineCfg(c) {
  const bkg=c.values.map((_,i)=>DPAL[i%DPAL.length]+'99');
  return {
    type:'bar',
    data:{labels:c.labels,datasets:[
      {type:'bar',label:c.title||'',data:c.values,backgroundColor:bkg,borderWidth:0,borderRadius:7,borderSkipped:false},
      {type:'line',label:'Trend',data:c.values,borderColor:'#1d4ed8',borderWidth:2.5,
       pointBackgroundColor:'#fff',pointBorderColor:'#1d4ed8',pointBorderWidth:2,pointRadius:4,pointHoverRadius:6,
       tension:0.35,fill:false,yAxisID:'y'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},datalabels:{display:false},
        tooltip:{backgroundColor:'#1e293b',callbacks:{
          label:ctx=>ctx.dataset.type==='line'?null:`${ctx.formattedValue}`
        }}},
      scales:{
        y:{grid:{color:'#f1f5f9'},border:{display:false},ticks:{font:{size:9},color:'#94a3b8',maxTicksLimit:5}},
        x:{grid:{display:false},border:{display:false},ticks:{font:{size:9},color:'#64748b'}}
      }}
  };
}

// Dual-axis bar+line chart: bars = primary metric ($BN), line = secondary metric (%)
// JSON: {type:"bar_line_dual", labels:[...], bar_values:[...], bar_label:"Net Profit ($BN)", line_values:[...], line_label:"Operating Margin (%)"}
function barLineDualCfg(c) {
  const bkg = (c.bar_values||c.values||[]).map((_,i)=>DPAL[i%DPAL.length]+'aa');
  const bvals = c.bar_values || c.values || [];
  const lvals = c.line_values || [];
  const isPercent = (c.line_label||'').includes('%') || (c.line_unit||'') === '%';
  return {
    type:'bar',
    data:{labels:c.labels||[],datasets:[
      {type:'bar',label:c.bar_label||c.title||'',data:bvals,
       backgroundColor:bkg,borderWidth:0,borderRadius:8,borderSkipped:false,yAxisID:'y'},
      {type:'line',label:c.line_label||'Margin',data:lvals,
       borderColor:'#1d4ed8',borderWidth:2.5,
       pointBackgroundColor:'#fff',pointBorderColor:'#1d4ed8',pointBorderWidth:2,
       pointRadius:4,pointHoverRadius:6,tension:0.35,fill:false,yAxisID:'y1'}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{labels:{font:{size:10},color:'#475569',boxWidth:10,padding:12,usePointStyle:true}},
        datalabels:{display:false},
        tooltip:{backgroundColor:'#1e293b',callbacks:{
          label:ctx=>{
            if(ctx.dataset.yAxisID==='y1') return `${ctx.dataset.label}: ${ctx.formattedValue}%`;
            return `${ctx.dataset.label}: ${ctx.formattedValue}`;
          }
        }}
      },
      scales:{
        y:{type:'linear',position:'left',grid:{color:'#f1f5f9'},border:{display:false},
          ticks:{font:{size:9},color:'#94a3b8',maxTicksLimit:5}},
        y1:{type:'linear',position:'right',grid:{drawOnChartArea:false},border:{display:false},
          ticks:{font:{size:9},color:'#1d4ed8',maxTicksLimit:5,callback:v=>v+'%'}},
        x:{grid:{display:false},border:{display:false},ticks:{font:{size:9},color:'#64748b'}}
      }}
  };
}

// Render a chart object onto a specific canvas element by ID
function renderChartObj(rawData, canvasId) {
  const canvas = document.getElementById(canvasId);
  if(!canvas || !rawData) return;
  if(!rawData.values && !rawData.datasets && !rawData.bar_values) return; // nothing to render
  if(charts[canvasId]) charts[canvasId].destroy();
  const c = enforceChartType(rawData);
  if(c.type==='grouped_bar' && c.datasets) {
    charts[canvasId]=new Chart(canvas,{
      type:'bar',
      data:{labels:c.labels,datasets:c.datasets.map((ds,i)=>({
        label:ds.label, data:ds.values,
        backgroundColor:DPAL[i%DPAL.length]+'cc', borderColor:DPAL[i%DPAL.length], borderWidth:0, borderRadius:5, borderSkipped:false
      }))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{font:{size:10},color:'#475569',boxWidth:10}},datalabels:{display:false}},
        scales:{y:{grid:{color:'#f1f5f9'},border:{display:false},ticks:{font:{size:10},color:'#94a3b8'}},x:{grid:{display:false},border:{display:false},ticks:{font:{size:10},color:'#64748b'}}}}
    });
  } else if(c.type==='doughnut' && c.values) {
    charts[canvasId]=new Chart(canvas, doughnutCfg(c));
  } else if(c.type==='bar_line_dual') {
    charts[canvasId]=new Chart(canvas, barLineDualCfg(c));
  } else if(c.type==='bar_line' && c.values) {
    charts[canvasId]=new Chart(canvas, barLineCfg(c));
  } else if(c.values) {
    const bkg=c.values.map((_,i)=>DPAL[i%DPAL.length]+'99');
    const brd=c.values.map((_,i)=>DPAL[i%DPAL.length]);
    charts[canvasId]=new Chart(canvas,{
      type:'bar',
      data:{labels:c.labels,datasets:[{label:c.title||'',data:c.values,backgroundColor:bkg,borderColor:brd,borderWidth:0,borderRadius:8,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},datalabels:{display:false}},
        scales:{y:{grid:{color:'#f8fafc'},border:{display:false},ticks:{font:{size:9},color:'#94a3b8',maxTicksLimit:5}},x:{grid:{display:false},border:{display:false},ticks:{font:{size:9},color:'#64748b'}}}}
    });
  }
}

function renderChart(tab, cid) {
  const canvas=document.getElementById(`${cid}-chart-${tab.id}`);
  if(!canvas||!tab.chart) return;
  const key=`${cid}-${tab.id}`;
  if(charts[key]) charts[key].destroy();
  const c = enforceChartType(tab.chart);
  if(c.type==='grouped_bar'&&c.datasets) {
    charts[key]=new Chart(canvas,{
      type:'bar',
      data:{labels:c.labels,datasets:c.datasets.map((ds,i)=>({
        label:ds.label, data:ds.values,
        backgroundColor:DPAL[i%DPAL.length]+'cc', borderColor:DPAL[i%DPAL.length], borderWidth:0, borderRadius:5, borderSkipped:false
      }))},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{labels:{font:{size:11},color:'#475569',boxWidth:12}},datalabels:{display:false}},
        scales:{y:{grid:{color:'#f1f5f9'},border:{display:false},ticks:{font:{size:10},color:'#94a3b8'}},x:{grid:{display:false},border:{display:false},ticks:{font:{size:10},color:'#64748b'}}}}
    });
  } else if(c.type==='doughnut'&&c.values) {
    charts[key]=new Chart(canvas, doughnutCfg(c));
  } else if(c.type==='bar_line_dual') {
    charts[key]=new Chart(canvas, barLineDualCfg(c));
  } else if(c.type==='bar_line'&&c.values) {
    charts[key]=new Chart(canvas, barLineCfg(c));
  } else if(c.values) {
    const bkg=c.values.map((_,i)=>DPAL[i%DPAL.length]+'99');
    const brd=c.values.map((_,i)=>DPAL[i%DPAL.length]);
    charts[key]=new Chart(canvas,{type:'bar',
      data:{labels:c.labels,datasets:[{label:c.title||'',data:c.values,backgroundColor:bkg,borderColor:brd,borderWidth:0,borderRadius:8,borderSkipped:false}]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},datalabels:{display:false}},
        scales:{y:{grid:{color:'#f8fafc'},border:{display:false},ticks:{font:{size:9},color:'#94a3b8',maxTicksLimit:5}},x:{grid:{display:false},border:{display:false},ticks:{font:{size:9},color:'#64748b'}}}}
    });
  }
}

// ── TAB SWITCH ────────────────────────────────────────────────────────────────
function swTab(cid,tabId) {
  document.querySelectorAll(`[id^="${cid}-p-"]`).forEach(p=>p.classList.add('hidden'));
  document.querySelectorAll(`[id^="${cid}-b-"]`).forEach(b=>{b.classList.remove('tab-active');b.classList.add('tab-inactive');});
  document.getElementById(`${cid}-p-${tabId}`)?.classList.remove('hidden');
  const btn=document.getElementById(`${cid}-b-${tabId}`);
  if(btn){btn.classList.add('tab-active');btn.classList.remove('tab-inactive');}
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function removeEl(id) {
  if(window._thinkTimers && window._thinkTimers[id]) {
    clearInterval(window._thinkTimers[id]);
    delete window._thinkTimers[id];
  }
  const el=document.getElementById(id);
  if(el) el.remove();
}
function scrollDown(){const c=document.getElementById('chat');requestAnimationFrame(()=>c.scrollTop=c.scrollHeight);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderMd(md){
  return md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^### (.+)$/gm,'<div class="font-semibold text-gray-800 mt-3 mb-1 text-sm">$1</div>')
    .replace(/^## (.+)$/gm,'<div class="font-bold text-gray-900 mt-3 mb-1">$1</div>')
    .replace(/^- (.+)$/gm,'<div class="flex gap-1.5 text-sm text-gray-600 mb-1"><span class="text-gray-400 mt-0.5">•</span><span>$1</span></div>')
    .replace(/\n\n/g,'<br><br>');
}
