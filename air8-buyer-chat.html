<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Air8 Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#f8fafc}
  @keyframes fa{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .fa{animation:fa .25s ease-out}
  .tab-btn{font-size:13px;font-weight:500;color:#64748b;white-space:nowrap;border-bottom:2px solid transparent;padding:12px 18px;cursor:pointer;transition:all .15s;background:none;border-left:none;border-right:none;border-top:none}
  .tab-btn:hover{color:#1e293b;background:#f8fafc}
  .tab-btn.act{color:#f97316;border-bottom-color:#f97316}
  .risk-low{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
  .risk-med{background:#fffbeb;color:#b45309;border:1px solid #fde68a}
  .risk-hi{background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
  .chip{padding:6px 14px;background:#fff;border:1px solid #e2e8f0;color:#64748b;font-size:12px;border-radius:999px;cursor:pointer;transition:all .15s;white-space:nowrap}
  .chip:hover{background:#fff7ed;color:#ea580c;border-color:#fed7aa}
  .flw{font-size:13px;color:#64748b;padding:10px 14px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;margin-top:12px;line-height:1.6}
  .flw b{color:#ea580c;font-weight:600}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header style="background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10">
  <div style="display:flex;align-items:center;gap:10px">
    <div style="width:32px;height:32px;border-radius:8px;background:#f97316;display:flex;align-items:center;justify-content:center">
      <span style="color:#fff;font-weight:700;font-size:13px">A8</span>
    </div>
    <div>
      <div style="font-size:13px;font-weight:700;color:#1e293b">Air8 Intelligence</div>
      <div style="font-size:11px;color:#94a3b8">Buyer · Market · Tariff · Sourcing</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <div style="width:8px;height:8px;border-radius:50%;background:#34d399"></div>
    <span style="font-size:12px;color:#94a3b8">Live</span>
  </div>
</header>

<div id="chat" style="flex:1;overflow-y:auto;padding:24px 16px;display:flex;flex-direction:column;gap:20px;max-width:860px;margin:0 auto;width:100%"></div>

<div style="background:#fff;border-top:1px solid #e2e8f0;padding:14px 16px 16px;flex-shrink:0">
  <div style="display:flex;align-items:flex-end;gap:8px;max-width:860px;margin:0 auto">
    <div style="flex:1;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:10px 16px;transition:border-color .15s" id="inpWrap">
      <textarea id="inp" rows="1" placeholder="Ask about any buyer, tariff, product or market trend..." style="width:100%;background:transparent;border:none;outline:none;font-size:14px;color:#1e293b;resize:none;line-height:1.6;max-height:80px" oninput="ar(this)" onkeydown="hk(event)"></textarea>
    </div>
    <button onclick="send()" id="sndBtn" style="width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#f97316;color:#fff;border:none;cursor:pointer;flex-shrink:0">
      <svg id="sndIco" style="width:16px;height:16px" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
      <div id="sndLdr" style="display:none;width:12px;height:12px;border:2px solid #fed7aa;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite"></div>
    </button>
  </div>
  <p style="text-align:center;font-size:10px;color:#94a3b8;margin:8px 0 0">Air8 Intelligence · Verify key data before decisions</p>
</div>

<script>
var W = 'https://air8-buyer-chat.erik-ai-bot-001.workers.dev/chat';
var history = [];
var charts = {};
var cardCount = 0;

function ar(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

function hk(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMsg(role, html, extra) {
  var chat = document.getElementById('chat');
  var wrap = document.createElement('div');
  wrap.className = 'fa';
  if (role === 'user') {
    wrap.innerHTML = '<div style="display:flex;justify-content:flex-end"><div style="max-width:72%;background:#f97316;color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;font-size:14px;line-height:1.6">' + esc(html) + '</div></div>';
  } else {
    wrap.innerHTML = '<div style="display:flex;gap:10px;align-items:flex-start"><div style="width:28px;height:28px;border-radius:8px;background:#f97316;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px"><span style="color:#fff;font-size:10px;font-weight:700">A8</span></div><div style="flex:1;min-width:0">' + html + (extra || '') + '</div></div>';
  }
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function addMarkdown(text) {
  var lines = text.split('\n');
  var out = '';
  var inList = false;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (line.startsWith('### ')) {
      if (inList) { out += '</ul>'; inList = false; }
      out += '<h3 style="font-size:14px;font-weight:700;color:#1e293b;margin:12px 0 6px">' + esc(line.slice(4)) + '</h3>';
    } else if (line.startsWith('## ')) {
      if (inList) { out += '</ul>'; inList = false; }
      out += '<h2 style="font-size:15px;font-weight:700;color:#1e293b;margin:14px 0 6px">' + esc(line.slice(3)) + '</h2>';
    } else if (line.startsWith('**') && line.endsWith('**')) {
      if (inList) { out += '</ul>'; inList = false; }
      out += '<p style="font-weight:700;color:#1e293b;margin:8px 0 4px">' + esc(line.slice(2,-2)) + '</p>';
    } else if (line.startsWith('- ') || line.startsWith('• ')) {
      if (!inList) { out += '<ul style="margin:6px 0;padding-left:18px">'; inList = true; }
      out += '<li style="font-size:13px;color:#475569;margin:3px 0;line-height:1.5">' + esc(line.slice(2)) + '</li>';
    } else if (line.trim() === '') {
      if (inList) { out += '</ul>'; inList = false; }
    } else {
      if (inList) { out += '</ul>'; inList = false; }
      out += '<p style="font-size:13px;color:#475569;margin:6px 0;line-height:1.6">' + esc(line) + '</p>';
    }
  }
  if (inList) out += '</ul>';
  addMsg('ai', '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px">' + out + '</div>');
}

function statColor(c) {
  if (c === 'blue') return 'background:#eff6ff;color:#1d4ed8;border:1px solid #bfdbfe';
  if (c === 'green') return 'background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0';
  if (c === 'amber' || c === 'yellow') return 'background:#fffbeb;color:#b45309;border:1px solid #fde68a';
  if (c === 'red') return 'background:#fff1f2;color:#be123c;border:1px solid #fecdd3';
  if (c === 'purple') return 'background:#faf5ff;color:#7e22ce;border:1px solid #e9d5ff';
  return 'background:#f8fafc;color:#475569;border:1px solid #e2e8f0';
}

function buildStats(stats) {
  if (!stats || !stats.length) return '';
  var html = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">';
  for (var i = 0; i < stats.length; i++) {
    var s = stats[i];
    html += '<div style="' + statColor(s.color) + ';border-radius:10px;padding:10px 14px;flex:1;min-width:120px">';
    html += '<div style="font-size:11px;opacity:.7;margin-bottom:2px">' + esc(s.label) + '</div>';
    html += '<div style="font-size:16px;font-weight:700">' + esc(s.value) + '</div>';
    if (s.sub) html += '<div style="font-size:10px;opacity:.6;margin-top:2px">' + esc(s.sub) + '</div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function buildRisks(risks) {
  if (!risks || !risks.length) return '';
  var html = '<div style="display:flex;flex-direction:column;gap:8px;margin:10px 0">';
  for (var i = 0; i < risks.length; i++) {
    var r = risks[i];
    var cls = r.level === 'High' ? 'risk-hi' : r.level === 'Med' || r.level === 'Medium' ? 'risk-med' : 'risk-low';
    html += '<div style="display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0">';
    html += '<span class="' + cls + '" style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;flex-shrink:0">' + esc(r.level) + '</span>';
    html += '<div><div style="font-size:13px;font-weight:600;color:#1e293b">' + esc(r.label) + '</div>';
    if (r.note) html += '<div style="font-size:12px;color:#64748b;margin-top:2px">' + esc(r.note) + '</div>';
    html += '</div></div>';
  }
  html += '</div>';
  return html;
}

function buildSignals(signals) {
  if (!signals || !signals.length) return '';
  var typeColor = function(t) {
    if (t === 'MARKET') return 'background:#eff6ff;color:#1d4ed8';
    if (t === 'COMPANY') return 'background:#f0fdf4;color:#15803d';
    if (t === 'REGULATORY') return 'background:#fff1f2;color:#be123c';
    return 'background:#f8fafc;color:#64748b';
  };
  var html = '<div style="display:flex;flex-direction:column;gap:6px;margin:10px 0">';
  for (var i = 0; i < signals.length; i++) {
    var s = signals[i];
    html += '<div style="padding:10px 14px;border-radius:10px;background:#fff;border:1px solid #e2e8f0">';
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">';
    html += '<span style="' + typeColor(s.type) + ';font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px">' + esc(s.type) + '</span>';
    if (s.date) html += '<span style="font-size:11px;color:#94a3b8">' + esc(s.date) + '</span>';
    html += '</div>';
    html += '<div style="font-size:13px;font-weight:600;color:#1e293b">' + esc(s.title) + '</div>';
    if (s.impact) html += '<div style="font-size:12px;color:#64748b;margin-top:3px">' + esc(s.impact) + '</div>';
    html += '</div>';
  }
  html += '</div>';
  return html;
}

function renderC(key, ch) {
  var canvas = document.getElementById('c-' + key);
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  if (charts[key]) { charts[key].destroy(); delete charts[key]; }

  var type = ch.type || 'bar';

  if (type === 'donut') {
    charts[key] = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ch.labels || [],
        datasets: [{
          data: ch.values || [],
          backgroundColor: ['#1d4ed8','#f97316','#10b981','#8b5cf6','#f59e0b','#ef4444','#06b6d4'],
          borderWidth: 2,
          borderColor: '#fff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: 'right', labels: { font: { size: 11 }, boxWidth: 12, padding: 12 } }
        },
        cutout: '60%'
      }
    });
    return;
  }

  if (type === 'grouped_bar') {
    var dsets = [];
    var colors = ['#1d4ed8','#f97316','#10b981','#8b5cf6'];
    var ds = ch.datasets || [];
    for (var i = 0; i < ds.length; i++) {
      dsets.push({ type: 'bar', label: ds[i].label, data: ds[i].data, backgroundColor: colors[i % colors.length], borderRadius: 4 });
    }
    charts[key] = new Chart(ctx, {
      type: 'bar',
      data: { labels: ch.labels || [], datasets: dsets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: true, position: 'top', labels: { font: { size: 11 }, boxWidth: 12, padding: 16 } } },
        scales: {
          x: { grid: { display: false }, ticks: { font: { size: 10 } } },
          y: { grid: { color: '#f1f5f9' }, ticks: { font: { size: 10 } } }
        }
      }
    });
    return;
  }

  // bar_line (default)
  var ds2 = ch.datasets || [];
  var d0 = { type: 'bar', label: ds2[0] ? ds2[0].label : '', data: ds2[0] ? ds2[0].data : [], backgroundColor: '#1d4ed8', borderRadius: 6 };
  var d1 = null;
  if (ds2[1]) {
    d1 = {
      type: 'line',
      label: ds2[1].label,
      data: ds2[1].data,
      borderColor: '#f97316',
      backgroundColor: 'transparent',
      borderWidth: 2,
      pointBackgroundColor: '#f97316',
      pointRadius: 3,
      yAxisID: 'y1',
      tension: 0.3
    };
  }
  var sc = {
    x: { grid: { display: false }, ticks: { font: { size: 10 } } },
    y: {
      grid: { color: '#f1f5f9' },
      ticks: { font: { size: 10 }, callback: function(v) { return ch.prefix ? ch.prefix + v : v; } },
      title: { display: !!(ds2[0] && ds2[0].axisLabel), text: ds2[0] ? (ds2[0].axisLabel || '') : '', font: { size: 10 }, color: '#94a3b8' }
    }
  };
  if (d1) {
    sc.y1 = {
      position: 'right',
      grid: { display: false },
      ticks: { font: { size: 10 }, callback: function(v) { return v + '%'; } },
      title: { display: !!(ds2[1] && ds2[1].axisLabel), text: ds2[1] ? (ds2[1].axisLabel || '') : '', font: { size: 10 }, color: '#94a3b8' }
    };
  }
  var allDs = [d0];
  if (d1) allDs.push(d1);
  charts[key] = new Chart(ctx, {
    type: 'bar',
    data: { labels: ch.labels || [], datasets: allDs },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: true, position: 'top', labels: { font: { size: 11 }, boxWidth: 12, padding: 16 } } },
      scales: sc
    }
  });
}

function swTab(cardId, tabId) {
  var tabContents = document.querySelectorAll('[data-card="' + cardId + '"][data-tab-content]');
  for (var i = 0; i < tabContents.length; i++) {
    tabContents[i].style.display = 'none';
  }
  var tabBtns = document.querySelectorAll('[data-card="' + cardId + '"].tab-btn');
  for (var i = 0; i < tabBtns.length; i++) {
    tabBtns[i].classList.remove('act');
  }
  var activeContent = document.querySelector('[data-card="' + cardId + '"][data-tab-content="' + tabId + '"]');
  if (activeContent) activeContent.style.display = 'block';
  var activeBtn = document.querySelector('[data-card="' + cardId + '"].tab-btn[data-tab="' + tabId + '"]');
  if (activeBtn) activeBtn.classList.add('act');

  // Render chart if needed
  var chartEl = document.getElementById('c-' + cardId + '-' + tabId);
  if (chartEl && chartEl.dataset.chartJson) {
    try {
      var ch = JSON.parse(chartEl.dataset.chartJson);
      renderC(cardId + '-' + tabId, ch);
    } catch(e) {}
  }
}

function addTabCard(p) {
  cardCount++;
  var cid = 'card' + cardCount;
  var tabs = p.tabs || [];

  // Build tab bar
  var tabBar = '<div style="display:flex;border-bottom:1px solid #e2e8f0;overflow-x:auto">';
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var cls = i === 0 ? 'tab-btn act' : 'tab-btn';
    tabBar += '<button class="' + cls + '" data-card="' + cid + '" data-tab="' + t.id + '" onclick="swTab(\'' + cid + '\',\'' + t.id + '\')">';
    if (t.icon) tabBar += '<span style="margin-right:5px">' + esc(t.icon) + '</span>';
    tabBar += esc(t.label) + '</button>';
  }
  tabBar += '</div>';

  // Build tab contents
  var tabContents = '';
  for (var i = 0; i < tabs.length; i++) {
    var t = tabs[i];
    var display = i === 0 ? 'block' : 'none';
    tabContents += '<div data-card="' + cid + '" data-tab-content="' + t.id + '" style="padding:16px;display:' + display + '">';

    if (t.insight) {
      tabContents += '<div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:12px 14px;font-size:13px;color:#9a3412;margin-bottom:12px;line-height:1.6"><span style="font-weight:700">💡 Insight: </span>' + esc(t.insight) + '</div>';
    }
    if (t.text) {
      tabContents += '<p style="font-size:13px;color:#475569;line-height:1.7;margin:0 0 12px">' + esc(t.text) + '</p>';
    }

    if (t.stats && t.stats.length) {
      tabContents += buildStats(t.stats);
    }

    if (t.chart) {
      var chartKey = cid + '-' + t.id;
      tabContents += '<div style="height:220px;margin-top:12px"><canvas id="c-' + chartKey + '" data-chart-json=\'' + JSON.stringify(t.chart).replace(/'/g,'&#39;') + '\'></canvas></div>';
    }

    if (t.risks && t.risks.length) {
      tabContents += '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">Risk Assessment</div>';
      tabContents += buildRisks(t.risks);
    }

    if (t.signals && t.signals.length) {
      tabContents += '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">Market Signals</div>';
      tabContents += buildSignals(t.signals);
    }

    if (t.coverage_gaps) {
      tabContents += '<div style="font-size:12px;color:#94a3b8;padding:10px;background:#f8fafc;border-radius:8px;margin-top:10px"><span style="font-weight:600">Coverage Note: </span>' + esc(t.coverage_gaps) + '</div>';
    }

    tabContents += '</div>';
  }

  // Follow-up text
  var followupHtml = '';
  if (p.followup_text) {
    var ftxt = p.followup_text.replace(/\|([^|]+)\|/g, '<b>$1</b>');
    followupHtml = '<div class="flw">' + ftxt + '</div>';
  }

  var summaryHtml = '';
  if (p.summary) {
    summaryHtml = '<div style="font-size:13px;color:#475569;padding:12px 16px 0">' + esc(p.summary) + '</div>';
  }

  var headerHtml = '';
  if (p.buyer) {
    headerHtml = '<div style="padding:14px 16px 0;display:flex;align-items:center;gap:10px">';
    headerHtml += '<div style="width:36px;height:36px;border-radius:10px;background:#1e293b;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="color:#fff;font-size:11px;font-weight:700">' + esc(p.buyer.substring(0,2).toUpperCase()) + '</span></div>';
    headerHtml += '<div><div style="font-size:15px;font-weight:700;color:#1e293b">' + esc(p.buyer) + '</div>';
    if (p.summary) headerHtml += '<div style="font-size:12px;color:#64748b">' + esc(p.summary) + '</div>';
    headerHtml += '</div></div>';
    summaryHtml = '';
  }

  var cardHtml = '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden">';
  cardHtml += headerHtml;
  cardHtml += summaryHtml;
  cardHtml += tabBar;
  cardHtml += tabContents;
  cardHtml += '</div>';
  cardHtml += followupHtml;

  addMsg('ai', cardHtml);

  // Render first tab chart immediately
  if (tabs[0] && tabs[0].chart) {
    setTimeout(function() {
      var key = cid + '-' + tabs[0].id;
      var el = document.getElementById('c-' + key);
      if (el && el.dataset.chartJson) {
        try { renderC(key, JSON.parse(el.dataset.chartJson)); } catch(e) {}
      }
    }, 50);
  }
}

function showThinking(steps) {
  var chat = document.getElementById('chat');
  var wrap = document.createElement('div');
  wrap.id = 'thinking-' + Date.now();
  wrap.className = 'fa';
  var stepsHtml = '';
  for (var i = 0; i < steps.length; i++) {
    stepsHtml += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:' + (i < steps.length - 1 ? '1px solid #f1f5f9' : 'none') + '">';
    stepsHtml += '<div style="width:20px;height:20px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#94a3b8">' + (i + 1) + '</div>';
    stepsHtml += '<div style="font-size:12px;color:#64748b">' + esc(steps[i]) + '</div>';
    stepsHtml += '</div>';
  }
  wrap.innerHTML = '<div style="display:flex;gap:10px;align-items:flex-start"><div style="width:28px;height:28px;border-radius:8px;background:#f97316;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px"><span style="color:#fff;font-size:10px;font-weight:700">A8</span></div><div style="flex:1"><div style="background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px"><div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Researching...</div>' + stepsHtml + '</div></div></div>';
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap.id;
}

function guessSteps(msg) {
  var m = msg.toLowerCase();
  if (m.includes('vs') || m.includes('compare') || m.includes('versus')) {
    return ['Identifying buyer profiles', 'Pulling financial benchmarks', 'Comparing sourcing patterns', 'Generating comparison view'];
  }
  if (m.includes('tariff') || m.includes('duty') || m.includes('hts') || m.includes('hs code')) {
    return ['Looking up HTS classification', 'Checking Section 301 / AD/CVD', 'Calculating landed cost impact', 'Summarizing tariff exposure'];
  }
  if (m.includes('trend') || m.includes('market') || m.includes('outlook') || m.includes('forecast')) {
    return ['Scanning market signals', 'Reviewing trade data', 'Identifying demand drivers', 'Composing market outlook'];
  }
  if (m.includes('customs') || m.includes('import') || m.includes('clearance') || m.includes('cbp')) {
    return ['Checking CBP requirements', 'Reviewing entry documentation', 'Verifying compliance rules', 'Summarizing customs workflow'];
  }
  if (m.includes('sourcing') || m.includes('supplier') || m.includes('factory') || m.includes('country')) {
    return ['Mapping sourcing regions', 'Reviewing country risk', 'Analyzing supply diversity', 'Compiling sourcing intelligence'];
  }
  // Default buyer profile steps
  return ['Looking up buyer profile', 'Analyzing financial statements', 'Reviewing sourcing strategy', 'Assessing payment risk', 'Generating intelligence report'];
}

function sq(t) {
  document.getElementById('inp').value = t;
  send();
}

function send() {
  var inp = document.getElementById('inp');
  var msg = inp.value.trim();
  if (!msg) return;
  inp.value = '';
  inp.style.height = 'auto';

  addMsg('user', msg);
  history.push({ role: 'user', content: msg });

  var steps = guessSteps(msg);
  var thinkId = showThinking(steps);

  document.getElementById('sndIco').style.display = 'none';
  document.getElementById('sndLdr').style.display = 'block';
  document.getElementById('sndBtn').disabled = true;

  var payload = JSON.stringify({ message: msg, history: history.slice(-6) });

  fetch(W, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: payload
  })
  .then(function(r) { return r.text(); })
  .then(function(raw) {
    var thinkEl = document.getElementById(thinkId);
    if (thinkEl) thinkEl.remove();

    var p = null;
    try {
      p = JSON.parse(raw);
    } catch(e) {}

    if (p && p.tabs) {
      addTabCard(p);
      history.push({ role: 'assistant', content: p.summary || 'Tabbed intelligence report generated.' });
    } else {
      addMarkdown(p && p.text ? p.text : raw);
      history.push({ role: 'assistant', content: raw.slice(0, 300) });
    }
  })
  .catch(function(err) {
    var thinkEl = document.getElementById(thinkId);
    if (thinkEl) thinkEl.remove();
    addMarkdown('Error connecting to Air8 Intelligence. Please try again.\n\n' + String(err));
  })
  .finally(function() {
    document.getElementById('sndIco').style.display = 'block';
    document.getElementById('sndLdr').style.display = 'none';
    document.getElementById('sndBtn').disabled = false;
  });
}

function init() {
  var chips = [
    { label: '🏬 Walmart buyer profile', q: 'Give me a buyer intelligence report on Walmart' },
    { label: '📦 Target sourcing strategy', q: 'What is Target\'s sourcing strategy and key supplier countries?' },
    { label: '📊 TJX financial analysis', q: 'Analyze TJX Companies financials and payment terms' },
    { label: '⚖️ Tariff impact on apparel', q: 'What is the tariff impact on apparel imports from China in 2025?' },
    { label: '🌏 Ross Stores vs Burlington', q: 'Compare Ross Stores vs Burlington Coat Factory as buyers' }
  ];

  var chipsHtml = '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:14px">';
  for (var i = 0; i < chips.length; i++) {
    chipsHtml += '<button class="chip" onclick="sq(' + JSON.stringify(chips[i].q) + ')">' + chips[i].label + '</button>';
  }
  chipsHtml += '</div>';

  var welcome = '<div style="background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px">';
  welcome += '<div style="font-size:16px;font-weight:700;color:#1e293b;margin-bottom:6px">Welcome to Air8 Intelligence 👋</div>';
  welcome += '<div style="font-size:13px;color:#64748b;line-height:1.6">Ask about any global buyer, tariff scenario, market trend, or sourcing strategy. I pull financial data, risk signals, and trade intelligence into one structured view.</div>';
  welcome += chipsHtml;
  welcome += '</div>';

  addMsg('ai', welcome);
}

init();
